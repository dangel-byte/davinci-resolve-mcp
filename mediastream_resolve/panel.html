<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mediastream Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Encode+Sans+Expanded:wght@600;700;800&family=Geist:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --lime:#97D700; --lemon:#B3E837; --violet:#A572EB; --ink:#1A1A1A; --card:#252525; --red:#FC3737;
  --text:#fff; --muted:rgba(255,255,255,.76); --faint:rgba(255,255,255,.62);
  --grad-cta:linear-gradient(45deg,#97D700,#B3E837);
  --focus:0 0 0 3px rgba(151,215,0,.38);
  --glow:0 0 20px rgba(142,101,216,.3); --glow-hover:0 0 24px rgba(142,101,216,.45);
  --r-sm:20px; --r-card:25px; --r-pill:100px;
  --display:"Encode Sans Expanded","Helvetica Neue",Arial,sans-serif;
  --body:Geist,Inter,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ink) radial-gradient(circle,rgba(151,215,0,.06) 3.248px,transparent 3.248px) 0 0/64.785px 64.014px;
  color:var(--text);font:14px/1.5 var(--body);-webkit-font-smoothing:antialiased}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:760px;margin:0 auto;padding:20px 20px 88px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}
header .logo{width:150px;height:auto;display:block}
nav{display:flex;gap:8px;margin-bottom:20px}
h2{font:800 20px/1.4 var(--display);margin:0 0 4px}
.eyebrow{font:700 12px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--lime);margin:0 0 8px}
.lead{color:var(--muted);margin:0 0 16px}
.hint{color:var(--faint);font-size:12.5px;margin:4px 0 12px}
.card{background:var(--card);border-radius:var(--r-card);padding:24px;margin-bottom:18px;box-shadow:var(--glow)}
label.f{display:block;font:700 11px/1 var(--display);margin:14px 0 6px 5px;color:rgba(255,255,255,.8)}
input,select{width:100%;height:46px;background:var(--ink);color:var(--text);border:2px solid rgba(255,255,255,.14);
  border-radius:var(--r-card);padding:10px 16px;font:15px var(--body);outline:none}
input::placeholder{color:rgba(255,255,255,.3)}
input:focus,select:focus{border-color:var(--lime);box-shadow:var(--focus)}
select option{background:var(--ink)}
.row{display:flex;gap:10px;align-items:center}
.row>input{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 24px;border:2px solid transparent;
  border-radius:var(--r-pill);font:700 14px var(--display);cursor:pointer;transition:filter .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.1)}
.btn:focus-visible{box-shadow:var(--focus);outline:none}
.btn.primary{background:var(--grad-cta);color:var(--ink)}
.btn.secondary{background:var(--text);color:var(--ink)}
.btn.outline{background:transparent;color:var(--text);border-color:rgba(255,255,255,.4)}
.btn.sm{height:36px;padding:0 16px;font-size:13px}
.btn[disabled]{background:#3a3a3a;color:#8a8a8a;filter:none;cursor:default}
.ib{width:40px;height:40px;padding:0;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:transparent;color:var(--text);
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.ib:hover{border-color:var(--lime);color:var(--lime)}
.ib:focus-visible{box-shadow:var(--focus);outline:none}
.tab{background:transparent;color:var(--text);border-color:rgba(255,255,255,.3)}
.tab[aria-selected=true]{background:var(--grad-cta);color:var(--ink);border-color:transparent}
.res{display:flex;gap:14px;align-items:center;padding:10px 0;border-top:1px solid rgba(255,255,255,.08)}
.res:first-child{border-top:0}
.res .th{width:96px;height:54px;border-radius:12px;background:var(--ink) center/cover;flex:none}
.res .tt{flex:1;min-width:0}
.res .tt b{display:block;font:700 14px var(--display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .tt span{font-size:12.5px;color:var(--faint)}
.pager{display:flex;align-items:center;justify-content:space-between;margin-top:12px;color:var(--faint);font-size:13px}
.badge{display:inline-block;font:700 11px/1 var(--display);text-transform:uppercase;padding:5px 14px;border-radius:var(--r-pill);white-space:nowrap}
.badge.done{background:var(--lime);color:var(--ink)}
.badge.running{background:rgba(165,114,235,.14);color:#c9aaf5;border:1px solid var(--violet)}
.badge.error{background:var(--red);color:#fff}
.job{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid rgba(255,255,255,.08)}
.job:first-child{border-top:0}
.job .tt{flex:1;min-width:0;font-size:13px}
.job .tt span{display:block;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--faint)}
.chk{display:flex;gap:10px;align-items:center;margin:14px 0 0;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--lime);padding:0}
.lang{display:flex;gap:8px}
.toast{min-height:20px;margin-top:10px;font-size:13px;color:var(--muted)}
.toast.err{color:#ff8a8a}
pre{background:var(--ink);border-radius:var(--r-sm);padding:14px;overflow:auto;max-height:240px;font-size:12px;color:var(--muted);white-space:pre-wrap;word-break:break-all}
.pill-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
[hidden]{display:none!important}
.cnt{margin-left:6px;background:var(--ink);color:var(--lime);border-radius:var(--r-pill);padding:1px 8px;font-size:11px}
.tab[aria-selected=true] .cnt{background:var(--ink)}
.strip{position:fixed;left:0;right:0;bottom:0;background:#141414;border-top:1px solid rgba(255,255,255,.1);padding:10px 20px;
  display:flex;align-items:center;gap:16px;font-size:13px;z-index:5}
.strip .in{max-width:720px;margin:0 auto;width:100%;display:flex;align-items:center;gap:16px}
.strip button{background:none;border:0;color:inherit;font:inherit;cursor:pointer;display:flex;align-items:center;gap:8px;padding:4px 0}
.strip button:focus-visible{box-shadow:var(--focus);outline:none;border-radius:8px}
.dot{width:9px;height:9px;border-radius:50%;background:#666;flex:none}
.dot.on{background:var(--lime);box-shadow:0 0 8px rgba(151,215,0,.7)}
.dot.busy{background:var(--violet);box-shadow:0 0 8px rgba(165,114,235,.7)}
.strip .msg{flex:1;text-align:right;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.strip .msg.err{color:#ff8a8a}
.btn.confirm{background:var(--red);color:#fff;border-color:transparent}
</style>
</head>

  jobRunning:"Running",jobDone:"Done",jobError:"Error",saved:"Token saved.",deleted:"Token deleted.",copied:"Embed copied.",started:"Job started: see the queue.",needFields:"Fill in export folder and preset.",needFile:"Enter the file path.",watching:"Watching",notWatching:"Not watching"},
 pt:{logTitle:"Registro",confirmDel:"Apagar?",watchOn:"Monitorando",watchOff:"Sem monitorar",jobsN:"em andamento",importing:"Em andamento",imported:"Importado",retry:"Tentar de novo",exportRunning:"Já há uma exportação em andamento.",config:"Configuração",language:"Idioma",token:"API token",tokenPh:"Cole seu API token da Platform",tokenSavedPh:"Novo token (guardado no Keychain)",
  onbEyebrow:"Primeiro uso",onbTitle:"Conecte sua conta",onbLead:"Cole o API token da Mediastream Platform. Ele fica guardado no Keychain do macOS e nunca é exibido de novo.",onbSave:"Salvar e continuar",
  save:"Salvar",delete:"Apagar",done:"Pronto",watchTitle:"Pasta monitorada",watchAuto:"Enviar sem perguntar",dismiss:"Descartar",watchHint:"Envia os vídeos novos que aparecerem na pasta, com o .srt irmão se existir.",folder:"Pasta",folderPh:"/caminho/da/pasta",watchStart:"Monitorar",watchStop:"Parar",
  tabMedia:"Mídia",tabUpload:"Enviar",library:"Biblioteca",libraryHint:"Busque no seu catálogo da Platform e importe o vídeo para o Media Pool.",search:"Buscar",searchPh:"Buscar na Platform…",
  import:"Importar",embed:"Copiar embed",noResults:"Sem resultados.",page:"Página",
  upTitle:"Timeline para a Platform",upHint:"Renderiza a timeline aberta com um preset do Deliver e envia.",titleLabel:"Título na Platform",titlePh:"Opcional",outDir:"Pasta de exportação",preset:"Preset do Deliver",srt:"Legendas .srt",srtPh:"Opcional: /caminho/arquivo.srt",exportBtn:"Exportar e enviar",
  fileTitle:"Enviar um arquivo",filePh:"/caminho/arquivo.mp4",upload:"Enviar",queue:"Fila",queueEmpty:"Vazia.",clear:"Limpar",showLog:"Ver registro",
  jobRunning:"Em andamento",jobDone:"Pronto",jobError:"Erro",saved:"Token salvo.",deleted:"Token apagado.",copied:"Embed copiado.",started:"Trabalho iniciado: veja a fila.",needFields:"Preencha a pasta de exportação e o preset.",needFile:"Informe o caminho do arquivo.",watching:"Monitorando",notWatching:"Sem monitorar"}
};
let lang="es", prefs={}, page=0, lastQuery="", cleared=new Set(), PAGE_SIZE=8;
const t=k=>(T[lang][k]||T.es[k]||k);
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(e=>{e.textContent=t(e.dataset.t)});
  document.querySelectorAll("[data-ph]").forEach(e=>{e.placeholder=t(e.dataset.ph)});
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-selected",b.dataset.lang===lang));
}
const logEl=$("log");
async function api(action,params){
  const r=await fetch("/api",{method:"POST",headers:{"X-Panel-Key":KEY},body:JSON.stringify({action,params:params||{}})});
  const j=await r.json();
  logEl.textContent=(new Date().toLocaleTimeString()+" "+action+" "+JSON.stringify(j).slice(0,400)+"\n")+logEl.textContent;
  return j;
}
const ERRS=[["render did not start",{es:"No se pudo iniciar el render.",en:"Render did not start.",pt:"Não foi possível iniciar o render."}],
 ["could not queue render job",{es:"No se pudo crear el trabajo de render. ¿Hay un timeline abierto y el preset es válido?",en:"Could not queue the render job. Is a timeline open and the preset valid?",pt:"Não foi possível criar o job de render. Há uma timeline aberta e o preset é válido?"}],
 ["render timed out",{es:"El render tardó demasiado.",en:"The render took too long.",pt:"O render demorou demais."}],
 ["render failed",{es:"El render falló.",en:"The render failed.",pt:"O render falhou."}],
 ["failed verification",{es:"El render no pasó la verificación; no se subió.",en:"The render failed verification; nothing was uploaded.",pt:"O render não passou na verificação; nada foi enviado."}],
 ["missing API token",{es:"Falta el API token.",en:"Missing API token.",pt:"Falta o API token."}],
 ["already running",{es:"Ya hay una exportación en curso.",en:"An export is already running.",pt:"Já há uma exportação em andamento."}]];
function errLocal(m){const f=ERRS.find(e=>String(m).includes(e[0]));return f?f[1][lang]:m}
let flashTimer=null;
function flash(msg,bad){const e=$("strip-msg");e.textContent=msg;e.classList.toggle("err",!!bad);clearTimeout(flashTimer);flashTimer=setTimeout(()=>{e.textContent=""},5000)}
const errMsg=j=>j&&j.error?errLocal(typeof j.error==="string"?j.error:(j.error.message||JSON.stringify(j.error))):"";
function say(id,msg,bad){const e=$(id);e.textContent=msg;e.classList.toggle("err",!!bad)}
function icon(paths){const s=document.createElementNS("http://www.w3.org/2000/svg","svg");s.setAttribute("class","i");s.setAttribute("viewBox","0 0 24 24");s.innerHTML=paths;return s}
const ICON={dl:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>',
  cp:'<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>'};

/* ---- screens ---- */
function show(screen){
  $("onboarding").hidden=screen!=="onboarding"; $("config").hidden=screen!=="config"; $("app").hidden=screen!=="app";
  $("btn-cfg").hidden=screen==="onboarding";
}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("[data-tab]").forEach(x=>x.setAttribute("aria-selected",x===b));
  $("panel-media").hidden=b.dataset.tab!=="media"; $("panel-upload").hidden=b.dataset.tab!=="upload";
  if(b.dataset.tab==="upload") loadPresets();
});
$("btn-cfg").onclick=()=>show("config");
$("btn-cfg-done").onclick=()=>{show("app");focusSearch()};
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=async()=>{lang=b.dataset.lang;applyLang();await api("prefs_set",{lang})});
$("show-log").onchange=e=>{logEl.hidden=!e.target.checked};

/* ---- token ---- */
$("btn-onb").onclick=async()=>{
  const r=await api("token_save",{token:v("tok-onb")}); $("tok-onb").value="";
  if(r.saved){show("app");loadPresets()} else say("onb-err",errMsg(r)||"error",true);
};
$("btn-tok-save").onclick=async()=>{const r=await api("token_save",{token:v("tok-cfg")});$("tok-cfg").value="";say("cfg-toast",r.saved?t("saved"):errMsg(r),!r.saved)};
let delArmed=null;
$("btn-tok-del").onclick=async()=>{
  const b=$("btn-tok-del");
  if(!delArmed){b.textContent=t("confirmDel");b.classList.add("confirm");delArmed=setTimeout(()=>{delArmed=null;b.textContent=t("delete");b.classList.remove("confirm")},3500);return}
  clearTimeout(delArmed);delArmed=null;b.textContent=t("delete");b.classList.remove("confirm");
  await api("token_delete");say("cfg-toast",t("deleted"));show("onboarding");
};

/* ---- media ---- */
async function search(p){
  page=p; lastQuery=v("q"); say("media-toast","");
  const r=await api("search",{query:lastQuery,limit:PAGE_SIZE,skip:p*PAGE_SIZE});
  const box=$("results"); box.textContent="";
  if(errMsg(r)){say("media-toast",errMsg(r),true);return}
  const items=r.items||[];
  if(!items.length){const e=document.createElement("p");e.className="empty";e.textContent=t("noResults");box.append(e)}
  for(const m of items){
    const row=document.createElement("div");row.className="res";
    const th=document.createElement("div");th.className="th";if(m.thumb)th.style.backgroundImage="url('"+m.thumb.replace(/'/g,"%27")+"')";
    const tt=document.createElement("div");tt.className="tt";
    const b=document.createElement("b");b.textContent=m.title||m.id;b.title=m.title||"";
    const s=document.createElement("span");s.textContent=(m.duration?Math.floor(m.duration/60)+":"+String(m.duration%60).padStart(2,"0")+" · ":"")+m.id;
    tt.append(b,s);
    const imp=document.createElement("button");imp.className="btn secondary sm";imp.append(icon(ICON.dl),document.createTextNode(t("import")));
    imp.onclick=async()=>{imp.disabled=true;imp.textContent=t("importing");const id=await startJob("download",{media_id:m.id},m.title||m.id);if(id)jobBtn[id]=imp;else{imp.disabled=false;imp.textContent="";imp.append(icon(ICON.dl),document.createTextNode(t("import")))}};
    const emb=document.createElement("button");emb.className="ib";emb.title=t("embed");emb.setAttribute("aria-label",t("embed"));emb.append(icon(ICON.cp));
    emb.onclick=async()=>{const e=await api("embed",{media_id:m.id});if(e.embed){await navigator.clipboard.writeText(e.embed);say("media-toast",t("copied"))}else say("media-toast",errMsg(e),true)};
    row.append(th,tt,imp,emb);box.append(row);
  }
  $("pager").hidden=!(p>0||items.length===PAGE_SIZE);
  $("page-label").textContent=t("page")+" "+(p+1);
  $("btn-prev").disabled=p===0; $("btn-next").disabled=items.length<PAGE_SIZE;
}
$("btn-search").onclick=()=>search(0);
$("q").onkeydown=e=>{if(e.key==="Enter")search(0)};
$("btn-prev").onclick=()=>search(Math.max(0,page-1));
$("btn-next").onclick=()=>search(page+1);

/* ---- upload tab ---- */
async function loadPresets(){
  const r=await api("presets"); const sel=$("up-preset"); const cur=prefs.preset||sel.value;
  sel.textContent="";
  for(const p of (r.presets||[])){const o=document.createElement("option");o.value=o.textContent=p;sel.append(o)}
  if(cur)sel.value=cur;
}
const jobBtn={};
async function startJob(action,params,label){
  const r=await api("job_start",{action,params,label});
  if(errMsg(r)){flash(errMsg(r),true);return null}
  flash(t("started")); tick(); return r.job_id;
}
$("btn-export").onclick=async()=>{
  const dir=v("up-dir"), preset=$("up-preset").value;
  if(!dir||!preset){say("up-toast",t("needFields"),true);return}
  if(exportBusy){flash(t("exportRunning"),true);return}
  await api("prefs_set",{export_dir:dir,preset});
  startJob("export_upload",{target_dir:dir,from_preset:preset,title:v("up-title"),srt_path:v("up-srt")},v("up-title")||preset);
};
$("btn-file").onclick=()=>{const p=v("file-path");if(!p){say("up-toast",t("needFile"),true);return}startJob("upload",{path:p},p.split("/").pop())};
$("btn-clear").onclick=async()=>{(await api("jobs")).jobs.filter(j=>j.status!=="running").forEach(j=>cleared.add(j.id));renderJobs((await api("jobs")))};

let pollTimer=null, exportBusy=false;
function renderJobs(r){
  const box=$("jobs"); box.textContent="";
  const jobs=(r.jobs||[]).filter(j=>!cleared.has(j.id));
  const w=r.watch||{};
  if(w.watching){const row=document.createElement("div");row.className="job";const tt=document.createElement("div");tt.className="tt";tt.textContent=t("watching")+": "+w.watching;row.append(tt);box.append(row);
    for(const f of w.pending||[]){const rr=document.createElement("div");rr.className="job";const x=document.createElement("div");x.className="tt";x.textContent=f;
      const up=document.createElement("button");up.className="btn primary sm";up.textContent=t("upload");up.onclick=async()=>{up.disabled=true;await api("watch_approve",{file:f});pollJobs()};
      const ds=document.createElement("button");ds.className="btn outline sm";ds.textContent=t("dismiss");ds.onclick=async()=>{await api("watch_dismiss",{file:f});pollJobs()};
      rr.append(x,up,ds);box.append(rr)}
    for(const l of w.log||[]){const rr=document.createElement("div");rr.className="job";const x=document.createElement("div");x.className="tt";x.textContent=l.file;const sp=document.createElement("span");sp.textContent=l.error||l.media_id||"";x.append(sp);
      const bd=document.createElement("span");bd.className="badge "+(l.error?"error":"done");bd.textContent=l.error?t("jobError"):t("jobDone");rr.append(x,bd);box.append(rr)}}
  if(!jobs.length&&!w.watching){const e=document.createElement("p");e.className="empty";e.textContent=t("queueEmpty");box.append(e)}
  for(const j of jobs){
    const row=document.createElement("div");row.className="job";
    const tt=document.createElement("div");tt.className="tt";tt.textContent=j.label;
    const sp=document.createElement("span");sp.textContent=errLocal(j.message||"");sp.title=sp.textContent;tt.append(sp);
    const bd=document.createElement("span");bd.className="badge "+j.status;bd.textContent=t(j.status==="running"?"jobRunning":j.status==="done"?"jobDone":"jobError");
    row.append(tt,bd);box.append(row);
  }
  const running=jobs.filter(j=>j.status==="running");
  exportBusy=running.some(j=>j.action==="export_upload");
  $("btn-export").disabled=exportBusy;
  const c=$("up-count");c.hidden=!running.length;c.textContent=running.length;
  const dot=$("strip-dot");dot.classList.toggle("on",!!w.watching);
  $("strip-watch-txt").textContent=w.watching?t("watchOn")+": "+w.watching.split("/").filter(Boolean).pop():t("watchOff");
  $("strip-jobs").hidden=!running.length;$("strip-jobs-txt").textContent=running.length+" "+t("jobsN");
  for(const j of (r.jobs||[])){const b=jobBtn[j.id];if(!b)continue;
    if(j.status==="done"){b.disabled=true;b.textContent="";b.append(icon('<path d="M20 6 9 17l-5-5"/>'),document.createTextNode(t("imported")));delete jobBtn[j.id]}
    else if(j.status==="error"){b.disabled=false;b.textContent="";b.append(icon(ICON.dl),document.createTextNode(t("retry")));flash(errLocal(j.message||t("jobError")),true);delete jobBtn[j.id]}}
  return running.length>0;
}
async function tick(){
  clearTimeout(pollTimer);
  let busy=false;
  try{busy=renderJobs(await api("jobs"))}catch(e){}
  pollTimer=setTimeout(tick,busy?2000:6000);
}
const pollJobs=tick;

/* ---- watch folder ---- */
async function watchStatus(){const r=await api("watch_status");say("watch-status",r.watching?t("watching")+": "+r.watching:t("notWatching"))}
$("watch-dir").oninput=()=>{$("btn-watch-start").disabled=!v("watch-dir")};
$("btn-watch-start").onclick=async()=>{const d=v("watch-dir");await api("prefs_set",{watch_dir:d});const r=await api("watch_start",{folder:d,auto:$("watch-auto").checked});
  if(errMsg(r)||r.success===false)say("watch-status",errMsg(r),true);else{await watchStatus();pollJobs()}};
$("btn-watch-stop").onclick=async()=>{await api("watch_stop");await watchStatus()};

/* ---- strip, keyboard ---- */
function goTab(name){document.getElementById("tab-"+name).click()}
$("strip-watch").onclick=()=>{show("config");$("watch-dir").focus()};
$("strip-jobs").onclick=()=>{show("app");goTab("upload")};
function focusSearch(){if(!$("app").hidden){goTab("media");$("q").focus();$("q").select()}}
document.addEventListener("keydown",e=>{
  const mod=e.metaKey||e.ctrlKey;
  if(mod&&e.key.toLowerCase()==="f"){e.preventDefault();show("app");focusSearch()}
  else if(mod&&e.key===","){e.preventDefault();if(!$("onboarding").hidden)return;show("config")}
  else if(mod&&e.key==="1"){e.preventDefault();show("app");goTab("media");$("q").focus()}
  else if(mod&&e.key==="2"){e.preventDefault();show("app");goTab("upload")}
  else if(e.key==="Escape"){if(!$("config").hidden){show("app");focusSearch()}}
});
$("up-title").onkeydown=e=>{if(e.key==="Enter")$("btn-export").click()};

/* ---- boot ---- */
(async()=>{
  prefs=await api("prefs_get");
  if(prefs.lang&&T[prefs.lang])lang=prefs.lang;
  applyLang();
  if(prefs.export_dir)$("up-dir").value=prefs.export_dir;
  if(prefs.watch_dir){$("watch-dir").value=prefs.watch_dir;$("btn-watch-start").disabled=false}
  watchStatus();
  const s=await api("token_status");
  show(s.saved?"app":"onboarding");
  if(s.saved){tick();$("q").focus()}
})();
</script>
</body>
