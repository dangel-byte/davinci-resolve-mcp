# Mediastream plugin for Resolve: build the frozen Windows (x64) engine, smoke-test it, publish the GitHub release,
# then install it with the one-line command exactly as a user would.
#   git tag mediastream-vX.Y.Z && git push fork mediastream-vX.Y.Z   then, on a Mac:  packaging/publish_mac_release.sh
# ponytail: macOS assets are built locally because GitHub's macOS arm64 runners never picked up the job
# (capacity, 2026-11-19). Add a macos-15 entry back to the matrix if they become reliable.
# (Does not match the upstream npm workflow, which listens to "v*".)
name: mediastream-release

on:
  push:
    tags: ["mediastream-v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: mediastream-resolve-windows-x64.zip
            exe: mediastream-engine.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches mediastream_resolve/__init__.py
        run: |
          v=$(python -c "import re;print(re.search(r'\"([^\"]+)\"',open('mediastream_resolve/__init__.py').read()).group(1))")
          test "mediastream-v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version $v"; exit 1; }
      - run: python -m pip install -q -r packaging/requirements-build.txt
      - run: python packaging/build_engine.py dist
      - name: Smoke test the frozen engine
        run: python packaging/smoke_engine.py "dist/mediastream-engine/${{ matrix.exe }}"
      - name: Windows Credential Manager round trip (untested code path; reported, not blocking)
        continue-on-error: true
        if: runner.os == 'Windows'
        run: |
          python -c "
          from mediastream_resolve.panel import Keychain
          k = Keychain(); assert k.kind == 'win'
          k.save('ci-test-token'); assert Keychain().load() == 'ci-test-token'
          k.delete(); assert Keychain().load() is None
          print('wincred OK')"
      - name: Plugin folder
        run: |
          P=pkg/com.mediastream.platform; mkdir -p "$P"
          cp resolve-plugin/com.mediastream.platform/{main.js,manifest.xml,package.json} "$P/"
          cp -R dist/mediastream-engine "$P/engine"
      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path pkg/com.mediastream.platform -DestinationPath "${{ matrix.asset }}"
      - name: Installer .exe (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $v = [regex]::Match((Get-Content mediastream_resolve/__init__.py -Raw), '"([^"]+)"').Groups[1].Value
          & $iscc /Q "/DAppVer=$v" "/DSrc=$PWD\pkg\com.mediastream.platform" "/O$PWD" packaging\windows\mediastream.iss
          if ($LASTEXITCODE) { exit 1 }
      - name: Installer .exe installs, runs and uninstalls
        shell: pwsh
        run: |
          $sup = "$env:ProgramData\Blackmagic Design\DaVinci Resolve\Support"; New-Item -ItemType Directory -Force $sup | Out-Null
          $exe = (Get-ChildItem Mediastream-Resolve-*-Windows.exe).FullName
          Start-Process $exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          $plug = "$sup\Workflow Integration Plugins\com.mediastream.platform"
          $cfg = Get-Content "$plug\config.json" -Raw | ConvertFrom-Json
          python packaging/smoke_engine.py $cfg.engine; if ($LASTEXITCODE) { exit 1 }
          Start-Process "$plug\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -Wait
          Start-Sleep 5
          if (Test-Path "$plug\engine") { throw "uninstall left $plug" }
          'installer OK'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}
          path: |
            ${{ matrix.asset }}
            Mediastream-Resolve-*-Windows.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp packaging/install-mac.sh packaging/install-windows.ps1 out/
          gh release create "$GITHUB_REF_NAME" out/* --title "Mediastream para DaVinci Resolve ${GITHUB_REF_NAME#mediastream-v}" \
            --notes "Instaladores: Mediastream-Resolve-*.pkg (Mac Apple Silicon) y Mediastream-Resolve-*-Windows.exe (sin firma: ver la guia PDF). Por comando, macOS (Apple Silicon): curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install-mac.sh | sh  ·  Windows (PowerShell): irm https://github.com/${{ github.repository }}/releases/latest/download/install-windows.ps1 | iex"

  verify:
    needs: release
    strategy:
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: One-line install (Windows PowerShell 5.1, as users run it)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:MS_TEST_ROOT = "$env:RUNNER_TEMP\root"; New-Item -ItemType Directory -Force $env:MS_TEST_ROOT | Out-Null
          irm https://github.com/${{ github.repository }}/releases/latest/download/install-windows.ps1 | iex
          $cfg = Get-Content "$env:MS_TEST_ROOT\Workflow Integration Plugins\com.mediastream.platform\config.json" -Raw | ConvertFrom-Json
          python packaging/smoke_engine.py $cfg.engine
          if ($LASTEXITCODE) { exit 1 }
